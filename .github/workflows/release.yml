name: インストーラーを作って配布する

# 「v0.1.0」のようなタグをつけて push すると、Windows / Mac / Linux 用のインストーラーを自動で作り、
# GitHub の「Releases」ページに載せます。（手動実行も可）
#
# アプリの「自動更新」は、このリリースを見て新しい版を見つけます。
#   ・latest*.yml（更新の目録）と .blockmap も、インストーラーといっしょに載せる必要があります（下の files に入っています）。
#   ・タグの数字（v0.2.0）と package.json の "version"（0.2.0）をそろえてください。そろっていないと、更新が見つかりません。
#   ・配布先（このリポジトリ）は、ここで自動的にビルドへ埋め込みます。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac
          - os: ubuntu-latest
            script: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
        if: matrix.os == 'ubuntu-latest'
      - name: タグと package.json の版がそろっているか確認
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "タグ ${GITHUB_REF_NAME} と package.json の version ($v) が違います。そろえてからやり直してください。"; exit 1; }
      - name: インストーラーを作る（自動更新の配布先を埋め込む）
        shell: bash
        run: npm run ${{ matrix.script }} -- --publish never -c.publish.provider=github -c.publish.owner=${{ github.repository_owner }} -c.publish.repo=${{ github.event.repository.name }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/latest*.yml
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/latest*.yml

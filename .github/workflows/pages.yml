name: GitHub Pages に公開

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4
      - name: Node.js を設定
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 依存関係をインストール
        run: npm ci
      - name: GitHub Pages を設定
        id: pages
        uses: actions/configure-pages@v5
      - name: Astro サイトをビルド
        run: npm run site:build -- --base "${{ steps.pages.outputs.base_path }}"
      - name: サイトをアップロード
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist-site
      - name: GitHub Pages に公開
        id: deployment
        uses: actions/deploy-pages@v4

